<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="spinachPotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="spLeaf1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="spLeaf2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="spLeafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadowS" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Soft Circle -->
  <circle cx="100" cy="100" r="90" fill="#ecfdf5" />

  <!-- Soil -->
  <ellipse cx="100" cy="146" rx="46" ry="12" fill="#451a03" opacity="0.8" />

  <!-- Broad Spinach Cluster Leaves -->
  <!-- Left Outer Leaf -->
  <g filter="url(#shadowS)">
    <path d="M96 142 C70 135 45 110 52 85 C62 65 85 95 96 130 Z" fill="url(#spLeaf2)" />
    <path d="M86 120 Q68 100 62 85" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M72 105 Q62 100 56 102" stroke="#a7f3d0" stroke-width="1.2" fill="none" opacity="0.5" />
  </g>

  <!-- Right Outer Leaf -->
  <g filter="url(#shadowS)">
    <path d="M104 142 C130 135 155 110 148 85 C138 65 115 95 104 130 Z" fill="url(#spLeafDark)" />
    <path d="M114 120 Q132 100 138 85" stroke="#6ee7b7" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M128 105 Q138 100 144 102" stroke="#6ee7b7" stroke-width="1.2" fill="none" opacity="0.5" />
  </g>

  <!-- Mid-Left Leaf -->
  <g filter="url(#shadowS)">
    <path d="M98 140 C80 120 65 80 82 55 C98 35 105 85 98 135 Z" fill="url(#spLeaf1)" />
    <path d="M96 115 Q86 85 86 60" stroke="#d1fae5" stroke-width="2" fill="none" opacity="0.7" />
  </g>

  <!-- Mid-Right Leaf -->
  <g filter="url(#shadowS)">
    <path d="M102 140 C120 120 135 80 118 55 C102 35 95 85 102 135 Z" fill="url(#spLeaf2)" />
    <path d="M104 115 Q114 85 114 60" stroke="#a7f3d0" stroke-width="2" fill="none" opacity="0.7" />
  </g>

  <!-- Tall Center Leaf -->
  <g filter="url(#shadowS)">
    <path d="M100 140 C90 100 85 50 100 35 C115 50 110 100 100 140 Z" fill="url(#spLeaf1)" />
    <path d="M100 135 L100 45" stroke="#d1fae5" stroke-width="2" fill="none" opacity="0.8" />
    <path d="M100 85 Q92 78 88 75" stroke="#d1fae5" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M100 95 Q108 88 112 85" stroke="#d1fae5" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M100 65 Q94 60 91 58" stroke="#d1fae5" stroke-width="1.2" fill="none" opacity="0.6" />
    <path d="M100 70 Q106 64 109 62" stroke="#d1fae5" stroke-width="1.2" fill="none" opacity="0.6" />
  </g>

  <!-- Modern White Planter with Emerald Accent -->
  <g filter="url(#shadowS)">
    <rect x="52" y="140" width="96" height="10" rx="3" fill="#e2e8f0" />
    <path d="M57 150 L67 186 Q69 188 74 188 L126 188 Q131 188 133 186 L143 150 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <!-- Emerald decorative band -->
    <rect x="62" y="160" width="76" height="6" rx="2" fill="url(#spinachPotGrad)" />
  </g>
</svg>